{
  "schema_version": "1.1",
  "name": "fork-tangent",
  "description": "The side question is forked once, under the current topic, not at the root.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "quick side question: how do I list my DynamoDB tables with the aws cli?",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/fork-tangent/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "forks-once",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"fork\"",
      "min": 1,
      "max": 1
    },
    {
      "type": "tool_used",
      "name": "not-at-root",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"--under\"\\s*,\\s*\"root\"",
      "min": 0,
      "max": 0
    }
  ]
}
