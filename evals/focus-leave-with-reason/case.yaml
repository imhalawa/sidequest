{
  "schema_version": "1.1",
  "name": "focus-leave-with-reason",
  "description": "With the user's reason, the switch runs with --reason.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "switch to the offsite planning, the venue deadline is in an hour",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/focus-leave-with-reason/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "switches-with-reason",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"now\"\\s*,\\s*\"3\".*--reason",
      "min": 1
    }
  ]
}
