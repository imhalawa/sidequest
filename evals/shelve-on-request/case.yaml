{
  "schema_version": "1.1",
  "name": "shelve-on-request",
  "description": "Parking the current topic shelves it with its branch instead of dropping or finishing it.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "park this topic for now, I want to come back to it later",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics",
      "AskUserQuestion"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/shelve-on-request/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "shelves",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"shelve\"\\s*,\\s*\"1\"",
      "min": 1
    },
    {
      "type": "tool_used",
      "name": "not-dropped",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"drop\"",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "not-done",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"done\"",
      "min": 0,
      "max": 0
    }
  ]
}
