{
  "schema_version": "1.1",
  "name": "focus-parks-idea",
  "description": "With focus on, an unrelated idea is parked, not forked, and the reply steers back to the outage.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "oh random thought: we should cache price lookups someday",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/focus-parks-idea/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "parks",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"park\"",
      "min": 1
    },
    {
      "type": "tool_used",
      "name": "no-fork",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"fork\"",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-switch",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"now\"",
      "min": 0,
      "max": 0
    }
  ]
}
