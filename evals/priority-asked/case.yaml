{
  "schema_version": "1.1",
  "name": "priority-asked",
  "description": "A topic that first comes up gets one short priority question: now, today, or later.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "I need to fix the flaky checkout integration tests",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "forks",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"fork\"",
      "min": 1
    },
    {
      "type": "regex",
      "name": "asks-priority",
      "target": "last_message",
      "pattern": "now.*today.*later|today.*later",
      "match": "contains",
      "flags": "is"
    }
  ]
}
