{
  "schema_version": "1.1",
  "name": "resume-keeps-tree",
  "description": "With an existing tree at session start, the reply names the open topics and forks nothing.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "where were we?",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics",
      "AskUserQuestion"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/resume-keeps-tree/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "no-fork",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"fork\"",
      "min": 0,
      "max": 0
    },
    {
      "type": "regex",
      "name": "names-current",
      "target": "last_message",
      "pattern": "order totals|the database",
      "match": "contains",
      "flags": "i"
    }
  ]
}
