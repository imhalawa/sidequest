{
  "schema_version": "1.1",
  "name": "back-to-parent",
  "description": "Returning to an earlier topic switches to #1 and forks nothing.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "ok, back to Sarah's CSV export now",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/back-to-parent/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "switches",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"now\"\\s*,\\s*\"1\"",
      "min": 1
    },
    {
      "type": "tool_used",
      "name": "no-new-topic",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"fork\"",
      "min": 0,
      "max": 0
    }
  ]
}
