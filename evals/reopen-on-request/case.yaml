{
  "schema_version": "1.1",
  "name": "reopen-on-request",
  "description": "An explicit request to reopen a finished topic reopens it.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "reopen the web pods topic, the errors came back",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/reopen-on-request/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "reopens",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"now\"\\s*,\\s*\"2\".*--reopen",
      "min": 1
    }
  ]
}
