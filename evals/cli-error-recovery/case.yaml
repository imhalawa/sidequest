{
  "schema_version": "1.1",
  "name": "cli-error-recovery",
  "description": "There is no DynamoDB topic in this tree; the reply checks the ids with show instead of guessing, and does not mark an unrelated topic done.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "the topic about checking DynamoDB is finished, mark it done",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/cli-error-recovery/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "checks-ids",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"show\"",
      "min": 1
    },
    {
      "type": "tool_used",
      "name": "no-wrong-done",
      "tool": "mcp__sidequest__topics",
      "input_match": "\"done\"\\s*,\\s*\"[13]\"",
      "min": 0,
      "max": 0
    }
  ]
}
