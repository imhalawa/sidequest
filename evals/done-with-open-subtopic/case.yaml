{
  "schema_version": "1.1",
  "name": "done-with-open-subtopic",
  "description": "A topic with an open subtopic is not left half-closed: the subtopic is closed or the user is asked about it.",
  "tags": [
    "sidequest"
  ],
  "execution": {
    "prompt": "the checkout timeout is fixed, mark it done",
    "max_turns": 10,
    "allowed_tools": [
      "mcp__sidequest__topics"
    ],
    "env": {
      "EVAL_SIDEQUEST_SEED": "evals/done-with-open-subtopic/fixtures/seed.json"
    }
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "handles-subtopic",
      "focus": "last_message",
      "criteria": "The reply either confirms that both 'Read the gateway logs' and 'Fix the checkout timeout' are now closed, or asks the user what to do with the still-open 'Read the gateway logs' subtopic. It does not claim the topic is done while ignoring the open subtopic."
    }
  ]
}
